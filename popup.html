<!DOCTYPE html>
<html>
<head>
  <title>Image Detector</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 320px;
      padding: 10px;
    }
    .image-item {
      display: inline-block;
      margin: 5px;
      text-align: center;
      width: 90px;
      vertical-align: top;
    }
    .image-item img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
    }
    .image-item img:hover {
      border-color: #0078d7;
    }
    .image-title {
      font-size: 11px;
      color: #333;
      margin-top: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    button {
      width: 100%;
      padding: 8px;
      background-color: #0078d7;
      color: white;
      border: none;
      border-radius: 5px;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
<h3>Detected Images</h3>
<div id="images"></div>
<button id="downloadAll">Download All</button>
<script src="popup.js"></script>
</body>
</html>
