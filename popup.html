<!DOCTYPE html>
<html>
<head>
  <title>Image Detector</title>
  <style>
    body {
      font-family: Arial;
      width: 300px;
      padding: 10px;
    }
    img {
      width: 80px;
      height: 80px;
      margin: 5px;
      cursor: pointer;
      border: 2px solid transparent;
      border-radius: 5px;
    }
    img:hover {
      border: 2px solid blue;
    }
    button {
      width: 100%;
      padding: 8px;
      background-color: #0078d7;
      color: white;
      border: none;
      border-radius: 5px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
<h3>Detected Images</h3>
<div id="images"></div>
<button id="downloadAll">Download All</button>
<script src="popup.js"></script>
</body>
</html>
