name: Build Chrome Extension

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies (if any)
        run: |
          if [ -f package.json ]; then
            npm install
          fi

      - name: Zip Chrome extension
        run: |
          mkdir -p build
          zip -r build/image-finder-extension.zip . -x "*.git*" "node_modules/*" "*.github/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-finder-extension
          path: build/image-finder-extension.zip
